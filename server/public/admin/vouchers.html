<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voucher - Trung Kim Admin</title>
<style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f5f7fb;margin:0;color:#172033}.wrap{max-width:1200px;margin:auto;padding:24px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:16px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
input,select,button{width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px}button{cursor:pointer}.primary{background:#0f3d73;color:#fff}.danger{color:#b42318}
table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #eee;text-align:left;font-size:14px}.actions{display:flex;gap:6px}.actions button{width:auto}
@media(max-width:760px){.grid{grid-template-columns:1fr}.table{overflow:auto}}
</style>
</head>
<body><div class="wrap">
<h1>Quản lý Voucher</h1>
<div class="card">
<input id="token" type="password" placeholder="ADMIN_TOKEN">
<button id="saveToken" class="primary" style="margin-top:8px">Lưu token & tải dữ liệu</button>
<div id="msg" style="margin-top:8px"></div>
</div>
<div class="card">
<h3 id="formTitle">Tạo voucher</h3>
<div class="grid">
<input id="code" placeholder="Mã voucher, VD: TRUNGKIM10">
<input id="name" placeholder="Tên chương trình">
<select id="type"><option value="percent">Giảm %</option><option value="fixed">Giảm số tiền</option></select>
<input id="value" type="number" placeholder="Giá trị giảm">
<input id="minOrder" type="number" placeholder="Đơn tối thiểu">
<input id="maxDiscount" type="number" placeholder="Giảm tối đa (để trống nếu không giới hạn)">
<input id="usageLimit" type="number" placeholder="Số lượt sử dụng">
<input id="startAt" type="datetime-local">
<input id="endAt" type="datetime-local">
<select id="active"><option value="true">Đang bật</option><option value="false">Tạm tắt</option></select>
</div>
<div class="actions" style="margin-top:12px">
<button id="save" class="primary">Lưu voucher</button><button id="cancel" hidden>Hủy sửa</button>
</div>
</div>
<div class="card table"><table><thead><tr><th>Mã</th><th>Tên</th><th>Giảm</th><th>Đơn tối thiểu</th><th>Đã dùng</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody id="rows"></tbody></table></div>
</div>
<script>
const $=id=>document.getElementById(id);let vouchers=[],editing=null;
$("token").value=localStorage.getItem("tk_admin_token")||"";
const money=v=>Number(v||0).toLocaleString("vi-VN")+"đ";
function token(){return $("token").value.trim()}
async function api(url,opt={}){const h={"Content-Type":"application/json",...(opt.headers||{})};if(token())h.Authorization="Bearer "+token();const r=await fetch(url,{...opt,headers:h});const d=await r.json().catch(()=>null);if(!r.ok)throw new Error(d?.message||"Yêu cầu thất bại");return d}
function form(){return{code:$("code").value.trim().toUpperCase(),name:$("name").value.trim(),type:$("type").value,value:Number($("value").value),minOrder:Number($("minOrder").value||0),maxDiscount:$("maxDiscount").value?Number($("maxDiscount").value):undefined,usageLimit:$("usageLimit").value?Number($("usageLimit").value):undefined,startAt:$("startAt").value?new Date($("startAt").value).toISOString():undefined,endAt:$("endAt").value?new Date($("endAt").value).toISOString():undefined,active:$("active").value==="true"}}
function reset(){editing=null;["code","name","value","minOrder","maxDiscount","usageLimit","startAt","endAt"].forEach(x=>$(x).value="");$("type").value="percent";$("active").value="true";$("formTitle").textContent="Tạo voucher";$("cancel").hidden=true}
function render(){$("rows").innerHTML=vouchers.map(v=>`<tr><td><b>${v.code}</b></td><td>${v.name}</td><td>${v.type==="percent"?v.value+"%":money(v.value)}</td><td>${money(v.minOrder)}</td><td>${v.usedCount}${v.usageLimit?"/"+v.usageLimit:""}</td><td>${v.active?"Đang bật":"Tạm tắt"}</td><td><div class="actions"><button onclick="editV('${v.id}')">Sửa</button><button class="danger" onclick="delV('${v.id}')">Xóa</button></div></td></tr>`).join("")}
async function load(){try{vouchers=await api("/api/vouchers/admin/all");render();$("msg").textContent="Đã tải voucher"}catch(e){$("msg").textContent=e.message}}
window.editV=id=>{const v=vouchers.find(x=>x.id===id);if(!v)return;editing=id;$("code").value=v.code;$("name").value=v.name;$("type").value=v.type;$("value").value=v.value;$("minOrder").value=v.minOrder;$("maxDiscount").value=v.maxDiscount??"";$("usageLimit").value=v.usageLimit??"";$("startAt").value=v.startAt?new Date(v.startAt).toISOString().slice(0,16):"";$("endAt").value=v.endAt?new Date(v.endAt).toISOString().slice(0,16):"";$("active").value=String(v.active);$("formTitle").textContent="Sửa voucher";$("cancel").hidden=false;scrollTo(0,0)}
window.delV=async id=>{if(!confirm("Xóa voucher này?"))return;try{await api("/api/vouchers/admin/"+id,{method:"DELETE"});await load()}catch(e){alert(e.message)}}
$("saveToken").onclick=()=>{localStorage.setItem("tk_admin_token",token());load()};
$("save").onclick=async()=>{try{await api(editing?"/api/vouchers/admin/"+editing:"/api/vouchers/admin",{method:editing?"PUT":"POST",body:JSON.stringify(form())});reset();await load()}catch(e){alert(e.message)}};
$("cancel").onclick=reset;load();
</script></body></html>
