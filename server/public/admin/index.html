<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TRUNG KIM - Quản lý sản phẩm</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f5f7fb;color:#14213d}.wrap{max-width:1200px;margin:auto;padding:20px}header{background:#102a56;color:white;padding:18px 20px;border-radius:14px;display:flex;justify-content:space-between;gap:15px;align-items:center}.card{background:white;border-radius:14px;padding:18px;margin-top:16px;box-shadow:0 2px 12px #0001}input,textarea,select{width:100%;box-sizing:border-box;padding:10px;border:1px solid #d8dee9;border-radius:8px}label{font-size:13px;font-weight:700;display:block;margin:8px 0 5px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.wide{grid-column:span 3}button{border:0;border-radius:8px;padding:10px 14px;cursor:pointer;font-weight:700}.primary{background:#d71920;color:white}.secondary{background:#102a56;color:white}.muted{background:#e9edf5}.danger{background:#b42318;color:white}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #eee;text-align:left;font-size:14px}.actions{display:flex;gap:6px;flex-wrap:wrap}.login{display:flex;gap:8px;max-width:480px}.login input{flex:1}.hidden{display:none}.variant-box{border:1px solid #d8dee9;border-radius:10px;padding:12px;margin-top:8px;background:#fafbfe}.variant-row{display:grid;grid-template-columns:1.2fr 1.2fr 1fr 1fr 1fr auto;gap:8px;align-items:end;margin-bottom:8px}.variant-empty{font-size:13px;color:#667085;padding:8px 0}@media(max-width:800px){.grid{grid-template-columns:1fr}.wide{grid-column:span 1}table{display:block;overflow:auto}.variant-row{grid-template-columns:1fr 1fr}.variant-row .variant-remove{grid-column:span 2}}
</style></head><body><div class="wrap"><header><div><b style="font-size:22px">TRUNG KIM</b><div>Quản lý sản phẩm Mini App</div></div><div id="status">Chưa đăng nhập</div></header>
<div class="card"><div class="login"><input id="token" type="password" placeholder="Nhập ADMIN_TOKEN"><button class="secondary" onclick="login()">Đăng nhập</button></div></div>
<div id="app" class="hidden"><div class="card"><h3 id="formTitle">Thêm sản phẩm</h3><input id="id" type="hidden"><div class="grid">
<div><label>Mã sản phẩm *</label><input id="sku"></div><div><label>Tên sản phẩm *</label><input id="name"></div><div><label>Tên tiếng Trung</label><input id="nameZh"></div>
<div><label>Danh mục *</label><input id="category"></div><div><label>Thương hiệu</label><input id="brand"></div><div><label>Trạng thái</label><select id="productStatus"><option value="active">Đang bán</option><option value="hidden">Ẩn</option></select></div>
<div><label>Giá bán (VND) *</label><input id="price" type="number" min="0"></div><div><label>Giá gốc/so sánh</label><input id="compareAtPrice" type="number" min="0"></div><div><label>Tồn kho *</label><input id="stock" type="number" min="0"></div>
<div class="wide"><label>Ảnh sản phẩm (mỗi dòng 1 URL)</label><textarea id="images" rows="4"></textarea></div><div class="wide"><label>Mô tả</label><textarea id="description" rows="4"></textarea></div><div class="wide"><label>Thông số kỹ thuật</label><textarea id="specifications" rows="4"></textarea></div>
<div class="wide"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><label>Phân loại / quy cách</label><button type="button" class="secondary" onclick="addVariant()">+ Thêm quy cách</button></div><div id="variantList" class="variant-box"></div><small>Mỗi quy cách có thể có mã SKU, giá bán, giá gốc và tồn kho riêng.</small></div>
</div><div style="margin-top:14px;display:flex;gap:8px"><button class="primary" onclick="saveProduct()">Lưu sản phẩm</button><button class="muted" onclick="resetForm()">Nhập mới</button></div></div>
<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h3>Danh sách sản phẩm</h3><button class="secondary" onclick="loadProducts()">Làm mới</button></div><table><thead><tr><th>Mã</th><th>Tên</th><th>Danh mục</th><th>Giá</th><th>Tồn</th><th>Trạng thái</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></div></div>
<script>
let token=localStorage.getItem('tk_admin_token')||'';let products=[];const $=id=>document.getElementById(id);$('token').value=token;if(token)login();
function money(n){return new Intl.NumberFormat('vi-VN').format(Number(n||0))+' ₫'}
async function api(url,opt={}){opt.headers={...(opt.headers||{}),'Content-Type':'application/json','Authorization':'Bearer '+token};const r=await fetch(url,opt);if(r.status===204)return null;const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.message||'Có lỗi xảy ra');return d}
async function login(){token=$('token').value.trim();try{await api('/api/products/admin/all');localStorage.setItem('tk_admin_token',token);$('app').classList.remove('hidden');$('status').textContent='Đã đăng nhập';loadProducts()}catch(e){alert(e.message);$('status').textContent='Đăng nhập thất bại'}}
async function loadProducts(){products=await api('/api/products/admin/all');$('rows').innerHTML=products.map(p=>`<tr><td>${p.sku}</td><td>${p.name}</td><td>${p.category}</td><td>${money(p.price)}</td><td>${p.stock}</td><td>${p.status==='active'?'Đang bán':'Ẩn'}</td><td><div class="actions"><button class="muted" onclick="editProduct('${p.id}')">Sửa</button><button class="secondary" onclick="toggle('${p.id}')">${p.status==='active'?'Ẩn':'Hiện'}</button><button class="danger" onclick="removeProduct('${p.id}')">Xóa</button></div></td></tr>`).join('')}
let variantDraft=[];
function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function renderVariants(){const box=$('variantList');if(!box)return;if(!variantDraft.length){box.innerHTML='<div class="variant-empty">Chưa có quy cách. Bấm “+ Thêm quy cách” để tạo.</div>';return}box.innerHTML=variantDraft.map((v,i)=>`<div class="variant-row"><div><label>Tên quy cách *</label><input value="${esc(v.name)}" oninput="setVariant(${i},'name',this.value)" placeholder="Ví dụ: 6mm"></div><div><label>Mã SKU</label><input value="${esc(v.sku||'')}" oninput="setVariant(${i},'sku',this.value)" placeholder="Ví dụ: BH001-6"></div><div><label>Giá bán *</label><input type="number" min="0" value="${Number(v.price||0)}" oninput="setVariant(${i},'price',this.value)"></div><div><label>Giá gốc</label><input type="number" min="0" value="${v.compareAtPrice??''}" oninput="setVariant(${i},'compareAtPrice',this.value)"></div><div><label>Tồn kho *</label><input type="number" min="0" value="${Number(v.stock||0)}" oninput="setVariant(${i},'stock',this.value)"></div><div class="variant-remove"><button type="button" class="danger" onclick="removeVariant(${i})">Xóa</button></div></div>`).join('')}
function addVariant(){variantDraft.push({id:'',name:'',sku:'',price:Number($('price').value||0),stock:0});renderVariants()}
function removeVariant(i){variantDraft.splice(i,1);renderVariants()}
function setVariant(i,key,value){if(!variantDraft[i])return;if(key==='price'||key==='stock')variantDraft[i][key]=Number(value||0);else if(key==='compareAtPrice')variantDraft[i][key]=value===''?undefined:Number(value);else variantDraft[i][key]=value}
function editProduct(id){const p=products.find(x=>x.id===id);if(!p)return;$('id').value=p.id;$('sku').value=p.sku;$('name').value=p.name;$('nameZh').value=p.nameZh||'';$('category').value=p.category;$('brand').value=p.brand||'';$('productStatus').value=p.status;$('price').value=p.price;$('compareAtPrice').value=p.compareAtPrice||'';$('stock').value=p.stock;$('images').value=(p.images||[]).join('\n');$('description').value=p.description||'';$('specifications').value=typeof p.specifications==='string'?p.specifications:(p.specifications?JSON.stringify(p.specifications,null,2):'');variantDraft=(p.variants||[]).map(v=>({...v}));renderVariants();$('formTitle').textContent='Sửa sản phẩm';scrollTo({top:0,behavior:'smooth'})}
function resetForm(){['id','sku','name','nameZh','category','brand','price','compareAtPrice','stock','images','description','specifications'].forEach(x=>$(x).value='');$('productStatus').value='active';variantDraft=[];renderVariants();$('formTitle').textContent='Thêm sản phẩm'}
function payload(){const variants=variantDraft.map(v=>({id:String(v.id||''),name:String(v.name||'').trim(),sku:String(v.sku||'').trim()||undefined,price:Number(v.price||0),stock:Number(v.stock||0),compareAtPrice:v.compareAtPrice===undefined?undefined:Number(v.compareAtPrice)}));if(variants.some(v=>!v.name))throw new Error('Vui lòng nhập tên cho tất cả quy cách');return{sku:$('sku').value.trim(),name:$('name').value.trim(),nameZh:$('nameZh').value.trim(),category:$('category').value.trim(),brand:$('brand').value.trim(),status:$('productStatus').value,price:Number($('price').value||0),compareAtPrice:$('compareAtPrice').value?Number($('compareAtPrice').value):undefined,stock:Number($('stock').value||0),images:$('images').value.split('\n').map(x=>x.trim()).filter(Boolean),description:$('description').value.trim(),specifications:$('specifications').value.trim(),variants}}
async function saveProduct(){try{const body=payload(),id=$('id').value;if(id)await api('/api/products/admin/'+id,{method:'PUT',body:JSON.stringify(body)});else await api('/api/products/admin',{method:'POST',body:JSON.stringify(body)});resetForm();await loadProducts();alert('Đã lưu sản phẩm')}catch(e){alert(e.message)}}
async function toggle(id){const p=products.find(x=>x.id===id);await api('/api/products/admin/'+id,{method:'PUT',body:JSON.stringify({status:p.status==='active'?'hidden':'active'})});loadProducts()}
async function removeProduct(id){if(!confirm('Xóa sản phẩm này?'))return;await api('/api/products/admin/'+id,{method:'DELETE'});loadProducts()}
renderVariants();
</script></body></html>
